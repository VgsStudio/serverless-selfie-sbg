name: Deploy

# Manual de propósito: deploy de evento ao vivo é decisão humana.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-serverless-selfie
  cancel-in-progress: false

# Repositório público = logs públicos. O ARN do papel (que contém o ID da conta)
# fica no secret AWS_DEPLOY_ROLE_ARN, que o GitHub troca por *** em qualquer log;
# a variable de mesmo nome é só reserva até o secret ser criado. A hosted zone é
# descoberta pelo nome no deploy, então o ID dela não precisa existir aqui.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: event
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Credenciais AWS via OIDC (sem access key)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: cdk deploy
        run: npx cdk deploy --all --require-approval never
        env:
          GITHUB_REPO_CLAIM: ${{ vars.REPO_OIDC_CLAIM }}
