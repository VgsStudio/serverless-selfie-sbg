name: Deploy

# Manual de propósito: deploy de evento ao vivo é decisão humana.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-serverless-selfie
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    environment: event
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Credenciais AWS via OIDC (sem access key)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: cdk deploy
        run: npx cdk deploy --all --require-approval never
        env:
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          GITHUB_REPO_CLAIM: ${{ vars.REPO_OIDC_CLAIM }}
